# Note to AI Friends: This is an Apollo Connectors schema. You should use your connectors-spec MCP tool if you have it available before editing this file.

extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.15", import: ["@key", "@shareable"])
  @link(
    url: "https://specs.apollo.dev/connect/v0.4"
    import: ["@source", "@connect"]
  )
  @source(
    name: "orders"
    http: {
      baseURL: "https://summit26-orders-api.up.railway.app"
      headers: [{ name: "X-Attendee-Id", from: "x-attendee-id" }]
    }
  )

type Query {
  order(id: ID!): Order
    @connect(
      source: "orders"
      http: { GET: "/orders/{$args.id}" }
      selection: """
      id
      customerId
      status
      created_at: createdAt
      total
      shippingAddress {
        line1
        city
        postalCode
        country
      }
      items {
        productId
        quantity
        price
        product: { id: productId }
      }
      """
    )

  cart: Cart
    @connect(
      source: "orders"
      http: { GET: "/cart" }
      selection: """
      total
      items {
        productId
        quantity
        price
        product: { id: productId }
      }
      """
    )
}

type Mutation {
  addToCart(productId: ID!, quantity: Int! = 1): Cart
    @connect(
      source: "orders"
      http: {
        POST: "/cart/items"
        body: "$({ productId: $args.productId, quantity: $args.quantity })"
      }
      selection: """
      total
      items {
        productId
        quantity
        price
        product: { id: productId }
      }
      """
    )

  removeFromCart(productId: ID!): Cart
    @connect(
      source: "orders"
      http: { DELETE: "/cart/items/{$args.productId}" }
      selection: """
      total
      items {
        productId
        quantity
        price
        product: { id: productId }
      }
      """
    )

  checkout(customerId: ID!): Order
    @connect(
      source: "orders"
      http: {
        POST: "/cart/checkout"
        body: "$({ customerId: $args.customerId })"
      }
      selection: """
      id
      customerId
      status
      created_at: createdAt
      total
      shippingAddress {
        line1
        city
        postalCode
        country
      }
      items {
        productId
        quantity
        price
        product: { id: productId }
      }
      """
    )
}

type Product @key(fields: "id", resolvable: false) {
  id: ID!
}

type Address @shareable {
  line1: String
  city: String
  postalCode: String
  country: String
}

type Order {
  id: ID!
  customerId: ID!
  status: String
  created_at: String
  total: Float!
  shippingAddress: Address!
  items: [OrderItem!]!
}

type OrderItem {
  productId: ID!
  quantity: Int!
  price: Float!
  product: Product
}

type Cart {
  items: [CartItem!]!
  total: Float!
}

type CartItem {
  productId: ID!
  quantity: Int!
  price: Float!
  product: Product
}
