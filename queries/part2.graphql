# After composition is restored, run this against the v2 API.
# The broken schema names the stock field `in_stock` until you alias it.
query ProductsWithRatingsAndReviews {
  products {
    id
    title
    rating
    inStock
    reviews {
      id
      rating
      comment
    }
  }
}

query OrderWithProducts($id: ID!) {
  order(id: $id) {
    id
    status
    total
    shippingAddress {
      city
      country
    }
    items {
      quantity
      price
      product {
        id
        title
        price
        rating
      }
    }
  }
}

query GetCart {
  cart {
    total
    items {
      productId
      quantity
      price
      product {
        id
        title
      }
    }
  }
}

mutation AddToCart($productId: ID!, $quantity: Int! = 1) {
  addToCart(productId: $productId, quantity: $quantity) {
    total
    items {
      productId
      quantity
      price
    }
  }
}

mutation RemoveFromCart($productId: ID!) {
  removeFromCart(productId: $productId) {
    total
    items {
      productId
      quantity
    }
  }
}

mutation Checkout($customerId: ID!) {
  checkout(customerId: $customerId) {
    id
    status
    customerId
    total
    shippingAddress {
      line1
      city
      postalCode
      country
    }
    items {
      productId
      quantity
      price
    }
  }
}
