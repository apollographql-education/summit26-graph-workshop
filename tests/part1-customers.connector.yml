config:
  schema: customers.graphql
  name: part1-customers

tests:
  - name: Query.customer maps name, contact, and address
    connector: Query.customer
    variables:
      $args:
        id: "1"
    apiResponseBody: |
      {
        "id": 1,
        "firstName": "Emily",
        "lastName": "Johnson",
        "email": "emily.johnson@x.dummyjson.com",
        "phone": "+81 965-431-3024",
        "address": {
          "line1": "1-2-3 Shibuya",
          "city": "Tokyo",
          "postalCode": "150-0002",
          "country": "JP"
        }
      }
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-customers-api.up.railway.app/customers/1
      connectorResponse: |
        {
          "id": 1,
          "firstName": "Emily",
          "lastName": "Johnson",
          "email": "emily.johnson@x.dummyjson.com",
          "phone": "+81 965-431-3024",
          "address": {
            "line1": "1-2-3 Shibuya",
            "city": "Tokyo",
            "postalCode": "150-0002",
            "country": "JP"
          }
        }
