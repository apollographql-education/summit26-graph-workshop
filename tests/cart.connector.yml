config:
  schema: orders.graphql
  name: cart

tests:
  - name: Query.cart maps line items
    connector: Query.cart
    variables:
      $requestHeaders:
        x-attendee-id: seat-001
    apiResponseBody: |
      {
        "items": [
          { "productId": 1, "quantity": 2, "price": 9.99 }
        ],
        "total": 19.98
      }
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-orders-api.up.railway.app/cart
        headers:
          x-attendee-id: seat-001
      connectorResponse: |
        {
          "total": 19.98,
          "items": [
            { "productId": 1, "quantity": 2, "price": 9.99, "product": { "id": 1 } }
          ]
        }

  - name: Mutation.addToCart posts the line item
    connector: Mutation.addToCart
    variables:
      $args:
        productId: "1"
        quantity: 2
      $requestHeaders:
        x-attendee-id: seat-001
    apiResponseBody: |
      {
        "items": [
          { "productId": 1, "quantity": 2, "price": 9.99 }
        ],
        "total": 19.98
      }
    expect:
      connectorRequest:
        method: POST
        url: https://summit26-orders-api.up.railway.app/cart/items
        headers:
          x-attendee-id: seat-001
        body: '{"productId":"1","quantity":"2"}'
      connectorResponse: |
        {
          "total": 19.98,
          "items": [
            { "productId": 1, "quantity": 2, "price": 9.99, "product": { "id": 1 } }
          ]
        }

  - name: Mutation.checkout posts the customer and maps the order
    connector: Mutation.checkout
    variables:
      $args:
        customerId: "1"
      $requestHeaders:
        x-attendee-id: seat-001
    apiResponseBody: |
      {
        "id": 1002,
        "customerId": 1,
        "status": "processing",
        "createdAt": "2026-09-25T15:00:00.000Z",
        "total": 19.98,
        "shippingAddress": {
          "line1": "1-2-3 Shibuya",
          "city": "Tokyo",
          "postalCode": "150-0002",
          "country": "JP"
        },
        "items": [
          { "productId": 1, "quantity": 2, "price": 9.99 }
        ]
      }
    expect:
      connectorRequest:
        method: POST
        url: https://summit26-orders-api.up.railway.app/cart/checkout
        headers:
          x-attendee-id: seat-001
        body: '{"customerId":"1"}'
      connectorResponse: |
        {
          "id": 1002,
          "customerId": 1,
          "status": "processing",
          "created_at": "2026-09-25T15:00:00.000Z",
          "total": 19.98,
          "shippingAddress": {
            "line1": "1-2-3 Shibuya",
            "city": "Tokyo",
            "postalCode": "150-0002",
            "country": "JP"
          },
          "items": [
            { "productId": 1, "quantity": 2, "price": 9.99, "product": { "id": 1 } }
          ]
        }
