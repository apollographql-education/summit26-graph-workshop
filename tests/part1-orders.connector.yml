config:
  schema: solutions/part1/orders.graphql
  name: part1-orders

tests:
  - name: Query.order maps line items as scalars
    connector: Query.order
    variables:
      $args:
        id: "1001"
      $requestHeaders:
        x-attendee-id: seat-001
    apiResponseBody: |
      {
        "id": 1001,
        "customerId": 1,
        "status": "delivered",
        "createdAt": "2026-03-12T14:22:00.000Z",
        "total": 69.97,
        "shippingAddress": {
          "line1": "1-2-3 Shibuya",
          "city": "Tokyo",
          "postalCode": "150-0002",
          "country": "JP"
        },
        "items": [
          { "productId": 1, "quantity": 2, "price": 9.99 },
          { "productId": 5, "quantity": 1, "price": 49.99 }
        ]
      }
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-orders-api.up.railway.app/orders/1001
        headers:
          x-attendee-id: seat-001
      connectorResponse: |
        {
          "id": 1001,
          "customerId": 1,
          "status": "delivered",
          "createdAt": "2026-03-12T14:22:00.000Z",
          "total": 69.97,
          "shippingAddress": {
            "line1": "1-2-3 Shibuya",
            "city": "Tokyo",
            "postalCode": "150-0002",
            "country": "JP"
          },
          "items": [
            { "productId": 1, "quantity": 2, "price": 9.99 },
            { "productId": 5, "quantity": 1, "price": 49.99 }
          ]
        }
