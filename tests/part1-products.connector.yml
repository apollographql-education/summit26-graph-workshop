config:
  schema: solutions/part1/products.graphql
  name: part1-products

tests:
  - name: Query.products maps the DummyJSON wrapper and aliases stock
    connector: Query.products
    apiResponseBody: |
      {
        "products": [
          {
            "id": 1,
            "title": "Essence Mascara Lash Princess",
            "description": "Volumizing mascara",
            "price": 9.99,
            "rating": 4.94,
            "stock": 5,
            "brand": "Essence",
            "category": "beauty",
            "thumbnail": "https://example.com/1.webp"
          }
        ],
        "total": 1,
        "skip": 0,
        "limit": 1
      }
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-products-api.up.railway.app/products
      connectorResponse: |
        [
          {
            "id": 1,
            "title": "Essence Mascara Lash Princess",
            "description": "Volumizing mascara",
            "price": 9.99,
            "rating": 4.94,
            "inStock": 5,
            "brand": "Essence",
            "category": "beauty",
            "thumbnail": "https://example.com/1.webp"
          }
        ]

  - name: Query.product fetches a single product by id
    connector: Query.product
    variables:
      $args:
        id: "1"
    apiResponseBody: |
      {
        "id": 1,
        "title": "Essence Mascara Lash Princess",
        "description": "Volumizing mascara",
        "price": 9.99,
        "rating": 4.94,
        "stock": 5,
        "brand": "Essence",
        "category": "beauty",
        "thumbnail": "https://example.com/1.webp"
      }
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-products-api.up.railway.app/products/1
      connectorResponse: |
        {
          "id": 1,
          "title": "Essence Mascara Lash Princess",
          "description": "Volumizing mascara",
          "price": 9.99,
          "rating": 4.94,
          "inStock": 5,
          "brand": "Essence",
          "category": "beauty",
          "thumbnail": "https://example.com/1.webp"
        }

  - name: Query.categories maps the root array
    connector: Query.categories
    apiResponseBody: |
      [
        { "id": "beauty", "name": "Beauty", "slug": "beauty" },
        { "id": "laptops", "name": "Laptops", "slug": "laptops" }
      ]
    expect:
      connectorRequest:
        method: GET
        url: https://summit26-products-api.up.railway.app/categories
      connectorResponse: |
        [
          { "id": "beauty", "name": "Beauty", "slug": "beauty" },
          { "id": "laptops", "name": "Laptops", "slug": "laptops" }
        ]
